name: release

# Push a tag like v0.2.0 to build Windows + Linux and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\hb_reader.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/HBReader-Setup-*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Build AppImage
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp assets/icon.png AppDir/hb_reader.png
          printf '[Desktop Entry]\nType=Application\nName=HB Reader\nExec=hb_reader %%f\nIcon=hb_reader\nCategories=Office;Viewer;\n' > AppDir/hb_reader.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/hb_reader" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "HBReader-$V-x86_64.AppImage"
      - uses: softprops/action-gh-release@v2
        with:
          files: HBReader-*.AppImage
